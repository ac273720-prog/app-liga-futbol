name: Aplicar tema deportivo analitico
on:
  push:
    paths:
      - 'sports-analytics-theme.css'
      - '.github/workflows/apply-sports-theme.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar hoja de estilo y actualizar cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          link='<link rel="stylesheet" href="sports-analytics-theme.css?v=1">'
          import re
          s=re.sub(r'<link rel="stylesheet" href="sports-analytics-theme\.css\?v=\d+">', link, s)
          if link not in s:
              s=s.replace('</head>', link+'\n</head>')
          p.write_text(s)
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Activar nuevo diseño deportivo analitico"
          git push
