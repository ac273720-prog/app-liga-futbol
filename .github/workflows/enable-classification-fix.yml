name: Restaurar clasificaciones visibles
on:
  push:
    paths:
      - 'classification-fix.js'
      - '.github/workflows/enable-classification-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar script de clasificaciones
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="classification-fix.js?v=1"></script>'
          if 'classification-fix.js' not in s:
              s=s.replace('</body></html>',tag+'</body></html>')
          else:
              import re
              s=re.sub(r'<script src="classification-fix\.js\?v=\d+"></script>',tag,s)
          p.write_text(s)
          PY
      - name: Guardar cambio
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Forzar tablas generales y zonas de clasificación"
          git push